services:
  ai-ops:
    image: ${AI_OPS_IMAGE:-ai-ops:local}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AI_OPS_BIND:-0.0.0.0}:${AI_OPS_PORT:-3000}:3000"
    mem_limit: ${AI_OPS_MEMORY_LIMIT:-2g}
    cpus: ${AI_OPS_CPU_LIMIT:-2.0}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    labels:
      forgeops.project: ai-ops
      forgeops.service: web
